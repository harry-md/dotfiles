"$schema" = "https://starship.rs/config-schema.json"
add_newline = false

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
# success_symbol = '[➜](bold green)'
# error_symbol = '[➜](bold red)'
# success_symbol = "[\\$](bold #6e94b2)"
# error_symbol = "[\\$](bold red)"

[line_break]
disabled = false

[package]
disabled = true

[cmd_duration]
disabled = true

[git_branch]
style = "bold mauve"

[directory]
truncation_length = 6
truncate_to_repo = true
style = "bold blue"

